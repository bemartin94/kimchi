<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- interactive-widget=resizes-content: without this, Android Chrome overlays
         the on-screen keyboard instead of shrinking the viewport, which makes
         `position: fixed` elements (like the search bar) and `100vh`-based
         layouts miscalculate and leave a gap that needs scrolling to clear. -->
    <!-- viewport-fit=cover: without this, the page isn't allowed to paint
         into the safe areas (notch, Android gesture-nav bar) at all -- that
         strip is reserved by the OS and falls back to its own default white
         fill, which no amount of theme-color/CSS can reach. This lets our
         own background extend there instead, with env(safe-area-inset-*)
         used where content needs to avoid the actual notch/gesture pill. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1412" />
    <title>mis recetas</title>
    <!-- Vercel's auto-generated project domain (kimchi-<team>.vercel.app) and
         the real canonical domain serve the same build but are different
         origins -- separate localStorage, separate installed-PWA scope. A
         vercel.json host redirect didn't take effect (Vercel appears to not
         let you redirect away its own auto-generated subdomain), so this
         bounces client-side instead, before anything else runs. -->
    <script>
      (function () {
        if (location.hostname === 'kimchi-bemartin94s-projects.vercel.app') {
          location.replace('https://kimchi-liart.vercel.app' + location.pathname + location.search + location.hash)
        }
      })()
    </script>
    <!-- Applies the stored dark/light preference before React mounts (and
         before first paint), so pages that don't use Layout/useTheme -- like
         Auth, which you see before signing in -- aren't stuck in light mode
         until some later page happens to call useTheme(). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1a1412' : '#faf6f1')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
